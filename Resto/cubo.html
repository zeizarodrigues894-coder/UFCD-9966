<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubo 3D Interativo</title>
    <link rel="stylesheet" href="cubo.css">
</head>
<body>
    <main>
        <h1>Cubo 3D Interativo</h1>
        <p>HTML +CSS + JavaScript</p>
        <div class="cenario" id="cenario">
            <div class="cubo" id="cubo">
                <div class="face frente">1</div>
                <div class="face direita">2</div>
                <div class="face traseira">3</div> 
                <div class="face baixo">4</div>
                <div class="face cima">5</div>
                <div class="face esquerda">6</div>
            </div>
        </div> 
        <div class="controlo" id="controlo">
            <button class="botoes" id="pausa">Pausar</button>
            <button class="botoes" id="mais">Aumentar</button>
            <button class="botoes" id="menos">Diminuir</button>
            <button class="botoes" id="rapido">Rapido</button>
            <button class="botoes" id="lento">Lento</button>
            <button class="botoes" id="normal">Normal</button>
            <button class="botoes" id="reset">Reiniciar</button>
        </div>   
    </main>
    <script src="cubo.js"></script>
</body>
</html>
