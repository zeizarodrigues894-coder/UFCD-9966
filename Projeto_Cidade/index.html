<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mini Cidade 3D</title><link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<main>
<h1>Mini Cidade 3D</h1>
<div class="palco">
  <div class="cidade" id="cidade">
    <div class="chao"><div class="estrada"></div></div>
    <div class="predio p1"><div class="frente">A<br>▦ ▦<br>▦ ▦</div><div class="lado"></div><div class="topo"></div></div>
    <div class="predio p2"><div class="frente">B<br>▦ ▦<br>▦ ▦<br>▦ ▦</div><div class="lado"></div><div class="topo"></div></div>
    <div class="predio p3"><div class="frente">C<br>▦ ▦</div><div class="lado"></div><div class="topo"></div></div>
    <div class="predio p4"><div class="frente">D<br>▦ ▦<br>▦ ▦</div><div class="lado"></div><div class="topo"></div></div>
  </div>
</div>
<div class="controlos">
<button id="esq">←</button><button id="dir">→</button>
<button id="cima">↑</button><button id="baixo">↓</button>
<button id="mais">Zoom +</button><button id="menos">Zoom -</button>
<button id="auto">Auto</button><button id="reset">Reset</button>
</div>
</main><script src="js/script.js"></script>
</body></html>
