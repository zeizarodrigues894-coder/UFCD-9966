<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratório de Luz 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111827;color:white;font-family:Arial,sans-serif}
.painel{position:fixed;z-index:2;top:15px;left:15px;max-width:390px;background:#111827dd;padding:15px;border:1px solid #ffffff22;border-radius:12px}
.painel h1{font-size:18px;margin:0 0 5px}.painel p{font-size:12px;color:#cbd5e1;margin:0 0 10px}
button{padding:8px 10px;margin:3px;border:0;border-radius:7px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="painel">
<h1>💡 Laboratório de Luz 3D</h1>
<p>Materiais + luzes + sombras</p>
<button id="ambiente">Luz ambiente</button>
<button id="foco">Mover foco</button>
<button id="sombras">Sombras</button>
<button id="rodar">Rodar objetos</button>
<button id="reset">Reset</button>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
